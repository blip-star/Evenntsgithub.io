services:
  web:
    build: .
    ports:
      - "${EVENTS_PORT:-8001}:8001"
    env_file:
      - .env
    volumes:
      - ./events_alerts.db:/app/events_alerts.db
      - ./logs:/app/logs
    restart: unless-stopped

  cron:
    build: .
    command: ["cron"]
    env_file:
      - .env
    volumes:
      - ./events_alerts.db:/app/events_alerts.db
      - ./logs:/app/logs
    restart: unless-stopped
